# Observer variant of "price-action-v3" v2 (owner 2026-11-16): every value inherited from strategies/price-action-v3
# ([strategy] extends) except [indicators] minimum_relative_volume = 1.5 (active: 2.0), to see live what a looser
# relative-volume filter would trade. Same strategy module; it never trades (docs/observers.md). Changing any value means
# a new `version`.

[strategy]
# Strategy name (the module this variant uses, see [observers] strategy_modules); recorded with every decision.
name = "price-action-v3"
# Strategy version; bump on any value change; recorded with every decision and trade.
version = "2-relvol-1.5"
# Folder under strategies/ whose values this file extends; only the differences are written here.
extends = "price-action-v3"
# Version that folder must declare; a changed parent is refused until this is updated with a new version.
extends_version = "2"

[indicators]
# Minimum relative cumulative volume (current / average of prior sessions at the same minute).
minimum_relative_volume = 1.5
