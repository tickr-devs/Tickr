name: ios-app
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - ".github/workflows/ios-app.yml"
      - "Aperture.xcworkspace/**"
  workflow_dispatch:
  # Weekly build of main, so a conflict between two separately green pull requests shows up.
  schedule:
    - cron: "0 12 * * 1"
# One run per pull request: a new push cancels the run still going for the previous one. macOS
# runner minutes cost ten times Linux ones.
concurrency:
  group: ios-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      # Build with the newest stable Xcode on the runner (the owner uses the current release).
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -n 1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      # Pinned: a new XcodeGen release could change the output and fail the check below.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The committed Aperture.xcodeproj must be exactly what project.yml generates. git status
      # also catches files the generator deleted or added (a staged diff would hide deletions).
      - name: Check the committed Xcode project matches project.yml
        run: |
          xcodegen generate
          changes=$(git status --porcelain --untracked-files=all -- .)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- .
            echo "::error::Aperture.xcodeproj differs from project.yml: run xcodegen in apps/ios and commit"
            exit 1
          fi
          test -f "Aperture.xcodeproj/xcshareddata/xcschemes/Aperture iOS.xcscheme"
      # Built through the root workspace, which is what the owner opens in Xcode.
      - name: Build for the iOS Simulator (unsigned)
        run: |
          if ! xcodebuild build \
              -workspace ../../Aperture.xcworkspace \
              -scheme 'Aperture iOS' \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:" build.log || tail -n 80 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/SourcePackages/" || true
          tail -n 3 build.log
  # Every tab, scrolled through, in English and Russian at three Dynamic Type sizes, on the
  # smallest, a standard and the largest iPhone, against `aperture demo`
  # (Tests/ApertureUITests/LayoutSweepUITests.swift). The pictures are kept as the run's artifact.
  layout-sweep:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -n 1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the demo bot API (port 8776, config/demo.toml)
        run: |
          python -m pip install -q -e .
          aperture demo > "$RUNNER_TEMP/demo.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8776/status > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/demo.log"
          exit 1
      - name: Pick the iPhones (smallest, standard, largest)
        run: |
          xcrun simctl list devices available
          pick() { xcrun simctl list devices available | grep -E "$1" | head -n 1 | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/'; }
          small=$(pick "iPhone (SE|16e|17e)")
          standard=$(pick "iPhone 1[0-9] \(")
          large=$(pick "Pro Max")
          echo "devices: $small / $standard / $large"
          {
            echo "SWEEP_DESTINATIONS<<EOF2"
            for name in "$small" "$standard" "$large"; do
              [ -n "$name" ] && echo "-destination platform=iOS Simulator,name=$name"
            done
            echo "EOF2"
          } >> "$GITHUB_ENV"
      - name: Layout sweep
        working-directory: apps/ios
        env:
          TEST_RUNNER_SWEEP_API: http://127.0.0.1:8776
        run: |
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=("-destination" "${line#-destination }")
          done <<< "$SWEEP_DESTINATIONS"
          xcodebuild test -project Aperture.xcodeproj -scheme "Aperture iOS Screen Tour" \
            "${args[@]}" -only-testing:ApertureUITests/LayoutSweepUITests \
            -resultBundlePath "$RUNNER_TEMP/sweep.xcresult" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/sweep.log" 2>&1 || { grep -E "error:|failed|Fail" "$RUNNER_TEMP/sweep.log" | tail -n 60; exit 1; }
          tail -n 5 "$RUNNER_TEMP/sweep.log"
      - name: Export the pictures
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/sweep.xcresult" ] || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/sweep.xcresult" \
            --output-path "$RUNNER_TEMP/ios-layout-sweep"
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-layout-sweep
          path: ${{ runner.temp }}/ios-layout-sweep
          if-no-files-found: ignore
