name: macos-app
on:
  pull_request:
    # ready_for_review: a draft skips this job; marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "tests/api/fixtures/**"
      - "src/tickr/api/schema/**"
      - "Tickr.xcworkspace/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:
  # Nightly build of main (07:00 UTC, outside US market hours): a conflict between two separately
  # green pull requests shows up, the release app bundle is checked, and the SwiftPM cache that
  # pull requests restore is saved. The UI tests run nightly in ui-tests.yml.
  schedule:
    - cron: "0 7 * * *"
# One run per pull request: a new push cancels the run still going for the previous one. macOS
# runner minutes cost ten times Linux ones.
concurrency:
  group: macos-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# The workflow only reads the repository: its token can change nothing.
permissions:
  contents: read
jobs:
  build-and-test:
    # Drafts skip the macOS runner (the bottleneck); run it on a draft through workflow_dispatch.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # The Xcode 27 image: the owner builds with Xcode 27, and the app uses its SDK (the title bar's
    # toolbar visibility priorities); macos-latest (macOS 26) has Xcode 26.x only.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The owner builds with the newest Xcode; use the newest release (not beta or RC) this runner has.
      - name: Select the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      # SwiftLint runs in the swift-rules workflow (Linux), on every pull request.
      - name: Design-system checks (docs/design-system.md)
        run: python3 apps/scripts/check_swift_rules.py
      - run: swift --version
      - name: Toolchain id for the build cache
        run: echo "XCODE_ID=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
      # SwiftPM build folders (with the fetched Factory checkout), so unchanged modules are not
      # compiled again. Saved only from main (the nightly run, below); pull requests restore it and
      # never save, because a pull request's cache is visible to that pull request alone and ~300 MB
      # per branch evicts main's from the 10 GB repository limit.
      # Key prefix v2: caches from before the repo rename hold absolute .../Aperture paths that break
      # the module cache under .../Tickr.
      - name: Restore SwiftPM builds
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Tickr/**') }}
          restore-keys: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-
      - name: Shared package (contract models, design) tests
        working-directory: apps/shared
        run: swift test
      # `swift test` builds the app's modules too, so no separate `swift build`.
      - name: macOS app screen-logic tests
        working-directory: apps/macos
        run: |
          swift test
          scripts/check-deployment-target.sh
      # Before the release build below, so the cache holds the debug builds pull requests reuse.
      - name: Save SwiftPM builds
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Tickr/**') }}
      # The release bundle (scripts/make-app.sh, ~2 min) is checked nightly on main, not on every push.
      - name: Release app bundle carries its icon
        if: github.event_name != 'pull_request'
        working-directory: apps/macos
        run: |
          scripts/make-app.sh
          scripts/check-app-bundle.sh build/Tickr.app
      # Builds the app and its UI test runner as the owner does in Xcode, without running them: the
      # UI tests (~8 min) run in ui-tests.yml on the `ui-tests` label and nightly on main.
      - name: Xcode workspace builds the macOS app and its UI tests
        run: |
          xcodebuild -version
          xcodebuild -workspace Tickr.xcworkspace -scheme "Tickr macOS" \
            -destination "platform=macOS" -derivedDataPath apps/macos/build/xcode \
            CODE_SIGN_IDENTITY=- build-for-testing
