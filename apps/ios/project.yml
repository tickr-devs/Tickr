# XcodeGen spec for the Aperture iOS app. The generated Aperture.xcodeproj IS committed so the
# app opens in Xcode as is; after editing this file run `xcodegen` and commit the result (CI fails
# when the two differ). Sources are a synchronized folder, so adding a Swift file under Aperture/
# needs no project change.
name: Aperture
options:
  bundleIdPrefix: local.aperture
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ApertureShared:
    path: ../shared
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Aperture:
    type: application
    platform: iOS
    sources:
      - path: Aperture
        type: syncedFolder
    dependencies:
      - package: ApertureShared
        product: ApertureKit
      - package: ApertureShared
        product: ApertureDesign
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Aperture
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Confirms commands that cancel orders or close positions.
        # Plain HTTP is allowed only to local addresses (the Simulator reaches the Mac's API on
        # 127.0.0.1). Remote access goes through HTTPS (Tailscale serve).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aperture.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme: {}
