# Settings of the signal research tools (python -m tickr.research outcomes). Results are
# observed price moves after recorded decisions, never profit. Read only by
# src/tickr/research/; the trading bot never reads this file. See docs/research.md.
# The what-if simulation uses config/replay.toml instead, so it fills exactly like the replay.
# Not here, each kept by its one owner: output decimal places (config/replay.toml output_decimal_places) and the ATR
# length moves are measured in (the active strategy's [indicators] atr_period).

[research]
# Minutes after the end of the decision bar at which the price move is measured, strictly increasing; read by research/outcomes.py.
horizons_minutes = [1, 5, 15, 30, 60]
# Exchange time zone (IANA name); a horizon that would leave the decision's session date is reported without numbers, and latency hours are labelled in it; read by research/outcomes.py and research/__main__.py (latency).
session_timezone = "America/New_York"
